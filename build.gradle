// Add Geckolib dependency for Forge 1.20.1 (4.4.7) from Cloudsmith repository.
plugins {
    id 'net.minecraftforge.gradle' version '5.1.56' apply false
    id 'java'
}

group = 'com.cosplayhathey'
version = '0.1.0'
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
    // GeckoLib Cloudsmith repository
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    // Add other mod repositories for Player Animator / Emotecraft as needed
}

dependencies {
    // Replace with the exact Forge MDK coordinate when setting up locally. Example:
    // implementation fg.deobf("net.minecraftforge:forge:1.20.1-47.1.0")

    // Geckolib for Forge 1.20.1
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.4.7")

    // Player Animator / Emotecraft - add when you have coordinates
    // implementation fg.deobf("com.example:player-animator:<version>")
}
